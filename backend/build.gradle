plugins {
    id 'java'
    id 'jacoco'
    id 'org.springframework.boot' version '4.0.3'
    id 'io.spring.dependency-management' version '1.1.7'
    id "org.sonarqube" version "7.3.0.8198"
}

group = 'com.inova27'
version = '0.0.1-SNAPSHOT'
description = 'Projeto inova27 UECE'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

sonar {
    properties {
        property "sonar.projectKey", "Inova27"
        property "sonar.projectName", "Inova27 UECE"
        // Lê a URL do env var — funciona tanto localmente (localhost:9000)
        // quanto dentro do Docker (http://sonarqube:9000)
        property "sonar.host.url", System.getenv("SONAR_HOST_URL") ?: "http://localhost:9000"
        property "sonar.coverage.jacoco.xmlReportPaths", "${layout.buildDirectory.get()}/reports/jacoco/test/jacocoTestReport.xml"
        property "sonar.java.source", "21"
        property "sonar.coverage.exclusions",
                "**/com/inova27/app/model/**, " +
                        "**/com/inova27/app/dto/**, " +
                        "**/com/inova27/app/exception/**, " +
                        "**/com/inova27/app/config/**" +
                        "**/com/inova27/app/specification/**"
    }
}

jacoco {
    toolVersion = "0.8.12"
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.2'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'com.auth0:java-jwt:4.4.0'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'com.pgvector:pgvector:0.1.4'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    runtimeOnly 'org.postgresql:postgresql'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.mockito:mockito-core'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// 1. Testes com cobertura habilitada
tasks.named('test') {
    useJUnitPlatform()
    jvmArgs '-XX:+EnableDynamicAgentLoading'
    jacoco {
        enabled = true
    }
}

// 2. Geração do relatório Jacoco (XML para o Sonar + HTML para visualização)
jacocoTestReport {
    dependsOn test   // garante que os testes rodam antes de gerar o relatório
    reports {
        xml.required = true    // obrigatório para o SonarQube ler
        html.required = true   // relatório visual em build/reports/jacoco
    }
}

// 3. A task sonarqube só roda após o relatório estar gerado
tasks.named('sonarqube').configure {
    dependsOn jacocoTestReport
}