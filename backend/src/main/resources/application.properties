spring.application.name=inova27

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update

api.security.token.secret=${JWT_SECRET}

# ========================
# EMAIL (GMAIL)
# ========================
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.frontend.url=${FRONTEND_URL}
email.destinatario.agin=${EMAIL_DESTINATARIO_AGIN}

# ========================
# ? ROTAS CONFIGURÁVEIS
# ========================
# {id} aceita somente numeros: rotas nomeadas (/pendentes, /meus...) nao caem nas regras de /{id}
api.paths.usuarios=/usuarios/**
api.paths.pessoas-id=/pessoas/{id:[0-9]+}
api.paths.jogos-id=/jogos/{id:[0-9]+}
api.paths.laboratorios-id=/laboratorios/{id:[0-9]+}
api.paths.startups-id=/startups/{id:[0-9]+}
api.paths.protecoes-id=/protecoes/{id:[0-9]+}
api.paths.servicos-id=/servicos/{id:[0-9]+}
api.paths.engines-id=/engines/{id:[0-9]+}
api.paths.linguagens-id=/linguagens/{id:[0-9]+}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

ollama.base-url=${OLLAMA_BASE_URL}

app.admin.email=${ADMIN_EMAIL}
app.admin.senha=${ADMIN_SENHA}